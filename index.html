<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>LOL 猜英雄</title>
  <style>
    :root{
      --bg:#07090d;
      --bg2:#0b0d12;
      --panel:#0d1118;
      --panel2:#111722;
      --panel3:#151c28;
      --line:#2a303a;
      --line-soft:#1c222c;
      --gold:#c89b3c;
      --gold2:#d9b45d;
      --gold3:#8d6b2d;
      --cream:#f0e6d2;
      --cream2:#cdbf9f;
      --text:#e7e2d4;
      --muted:#8d8a82;
      --muted2:#65645f;
      --cyan:#0ac8b9;
      --danger:#a83b45;
      --danger2:#6d2b32;
      --ok:#56b88a;
      --shadow:0 18px 60px rgba(0,0,0,.42);
      --serif:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;
      --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }

    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:var(--sans);
      background:
        radial-gradient(circle at 50% 0%,rgba(48,57,75,.22),transparent 36%),
        radial-gradient(circle at 50% 100%,rgba(75,54,24,.10),transparent 40%),
        linear-gradient(180deg,#07090d 0%,#0a0d13 55%,#07090d 100%);
      overflow-x:hidden;
    }

    /* Slow decorative ring: visually similar to a game client backdrop, but CSS-only. */
    body::before{
      content:"";
      position:fixed;
      z-index:-2;
      left:50%;
      top:50%;
      width:min(1120px,94vmin);
      aspect-ratio:1/1;
      transform:translate(-50%,-50%);
      border-radius:50%;
      opacity:.18;
      background:
        repeating-conic-gradient(
          from 0deg,
          rgba(200,155,60,.70) 0deg 1deg,
          transparent 1deg 5deg
        );
      -webkit-mask:
        radial-gradient(circle,transparent 0 48%,#000 48.5% 49.1%,transparent 49.5% 57%,
          #000 57.4% 57.9%,transparent 58.4% 100%);
      mask:
        radial-gradient(circle,transparent 0 48%,#000 48.5% 49.1%,transparent 49.5% 57%,
          #000 57.4% 57.9%,transparent 58.4% 100%);
      animation:lcuRing 120s linear infinite;
      pointer-events:none;
    }
    body::after{
      content:"";
      position:fixed;
      z-index:-1;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(90deg,rgba(0,0,0,.34),transparent 20%,transparent 80%,rgba(0,0,0,.34)),
        radial-gradient(circle at center,transparent 20%,rgba(0,0,0,.22) 85%);
    }
    @keyframes lcuRing{
      from{transform:translate(-50%,-50%) rotate(0deg)}
      to{transform:translate(-50%,-50%) rotate(360deg)}
    }
    @media (prefers-reduced-motion:reduce){
      body::before{animation:none}
      *,*::before,*::after{scroll-behavior:auto!important}
    }

    button,input{font:inherit}
    button{
      min-height:44px;
      border-radius:4px;
      padding:0 16px;
      font-weight:750;
      letter-spacing:.02em;
      cursor:pointer;
      transition:transform .12s ease,filter .12s ease,border-color .12s ease,
        background-color .12s ease,color .12s ease,box-shadow .12s ease;
    }
    button:not(:disabled):hover{filter:brightness(1.08)}
    button:not(:disabled):active{transform:translateY(1px);filter:brightness(.94)}
    button:focus-visible,input:focus-visible{outline:2px solid rgba(200,155,60,.45);outline-offset:2px}
    button:disabled{opacity:.38;cursor:not-allowed}

    .primary{
      color:#11100c;
      border:1px solid #d4ae54;
      background:linear-gradient(180deg,#d7b35c,#b8862d);
      box-shadow:inset 0 0 0 1px rgba(255,235,172,.12),0 0 18px rgba(200,155,60,.08);
    }
    .primary:not(:disabled):hover{box-shadow:0 0 20px rgba(200,155,60,.16)}
    .secondary{
      color:var(--cream);
      border:1px solid #3b4654;
      background:linear-gradient(180deg,#202936,#151c27);
    }
    .ghost{
      color:var(--cream2);
      border:1px solid #4b4434;
      background:rgba(7,9,13,.45);
    }
    .ghost:not(:disabled):hover{border-color:var(--gold);color:var(--cream)}
    .danger{
      color:#f7e9e9;
      border:1px solid #9d4d54;
      background:linear-gradient(180deg,#8b3942,#64272e);
    }

    .wrap{
      width:min(1040px,100%);
      margin:0 auto;
      padding:24px 14px 46px;
    }
    .brandKicker{
      margin-top:2px;
      color:var(--gold);
      font-family:var(--serif);
      font-size:10px;
      font-weight:700;
      letter-spacing:.23em;
      text-transform:uppercase;
      opacity:.9;
    }
    h1{
      margin:5px 0 2px;
      color:var(--cream);
      font-family:var(--serif);
      font-size:clamp(26px,4vw,38px);
      font-weight:700;
      letter-spacing:.06em;
      text-shadow:0 2px 24px rgba(200,155,60,.08);
    }
    h2,h3{
      font-family:var(--serif);
      color:var(--cream);
      letter-spacing:.035em;
    }
    .sub{
      color:var(--muted);
      font-size:12px;
      margin:0 0 19px;
      letter-spacing:.03em;
    }

    .card{
      position:relative;
      margin:12px 0;
      padding:16px;
      border:1px solid var(--line);
      border-radius:8px;
      background:linear-gradient(180deg,rgba(16,21,30,.96),rgba(10,14,21,.96));
      box-shadow:0 12px 34px rgba(0,0,0,.20);
    }
    .card::before{
      content:"";
      position:absolute;
      top:-1px;
      left:20px;
      right:20px;
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(200,155,60,.55),transparent);
      pointer-events:none;
    }

    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .between{justify-content:space-between}

    input{
      width:100%;
      border:1px solid #333b47;
      border-radius:4px;
      padding:12px 13px;
      font-size:16px;
      outline:none;
      color:var(--cream);
      background:#080b10;
      transition:border-color .14s ease,box-shadow .14s ease,background-color .14s ease;
    }
    input::placeholder{color:#555b63}
    input:focus{
      border-color:var(--gold3);
      background:#0b0e14;
      box-shadow:inset 0 0 0 1px rgba(200,155,60,.08);
    }

    .hidden{display:none!important}

    .players{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    .p{
      min-width:0;
      padding:12px;
      border:1px solid #303744;
      border-radius:6px;
      background:linear-gradient(180deg,#121823,#0d121a);
    }
    .p.you{
      border-color:#80652f;
      box-shadow:inset 0 0 0 1px rgba(200,155,60,.08);
    }
    .p.offline{opacity:.48}

    .name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:var(--cream);
      font-weight:800;
    }
    .meta{font-size:11px;color:var(--muted);margin-top:4px}
    .dot{
      display:inline-block;
      width:7px;
      height:7px;
      margin-right:6px;
      border-radius:50%;
      background:var(--ok);
      box-shadow:0 0 8px rgba(86,184,138,.30);
    }
    .dot.off{background:#656a72;box-shadow:none}

    .heroGrid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
      align-items:start;
    }
    .heroCard{
      position:relative;
      overflow:hidden;
      text-align:center;
      border:1px solid #303744;
      border-radius:7px;
      background:linear-gradient(180deg,#101620,#090d13);
      box-shadow:0 10px 30px rgba(0,0,0,.22);
      transition:border-color .16s ease,transform .16s ease,box-shadow .16s ease;
    }
    .heroCard:hover{
      border-color:#5a4d31;
      box-shadow:0 14px 34px rgba(0,0,0,.28),0 0 0 1px rgba(200,155,60,.03);
    }
    .heroCard.you{border-color:#8b6c30}
    .heroPic{
      display:block;
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      background:#080a0f;
      filter:saturate(.93) contrast(1.03);
    }
    .unknown{
      display:grid;
      place-items:center;
      width:100%;
      aspect-ratio:1/1;
      color:var(--gold2);
      font-family:var(--serif);
      font-size:clamp(54px,10vw,82px);
      font-weight:700;
      background:
        radial-gradient(circle at center,rgba(39,45,57,.82) 0%,rgba(13,17,24,.95) 56%,#080b10 100%);
      text-shadow:0 0 24px rgba(200,155,60,.16);
    }
    .heroFoot{
      position:relative;
      padding:11px 11px 12px;
      background:linear-gradient(180deg,rgba(18,24,34,.98),rgba(9,13,19,.99));
      border-top:1px solid #242b34;
    }
    .heroFoot::before{
      content:"";
      position:absolute;
      top:-1px;
      left:16%;
      width:68%;
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(200,155,60,.42),transparent);
    }
    .status{font-size:11px;color:var(--muted);margin-top:5px}

    .tag{
      display:inline-block;
      padding:3px 7px;
      border:1px solid #39414d;
      border-radius:3px;
      background:#141b26;
      color:#b7bcc5;
      font-size:11px;
    }
    .oktag{
      border-color:#31654e;
      background:#10271d;
      color:#8ed6b0;
    }
    .outtag{
      border-color:#69353a;
      background:#2a1518;
      color:#e6a2a7;
    }

    .notesBox{margin-top:10px;text-align:left}
    .notesLabel{
      margin-bottom:6px;
      color:#817761;
      font-family:var(--serif);
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .noteList{display:flex;flex-wrap:wrap;gap:5px;min-height:23px}
    .noteChip{
      display:inline-flex;
      align-items:center;
      gap:5px;
      max-width:100%;
      padding:3px 7px;
      border:1px solid #4a412e;
      border-radius:3px;
      background:#15130f;
      color:#d6c9aa;
      font-size:11px;
      line-height:1.3;
    }
    .noteChipText{overflow-wrap:anywhere}
    .noteDelete{
      display:inline-grid;
      place-items:center;
      width:17px;
      height:17px;
      min-width:17px;
      min-height:17px;
      padding:0;
      border:0;
      border-radius:2px;
      background:#2b261d;
      color:#958a72;
      font-size:12px;
      font-weight:900;
    }
    .noteDelete:hover{background:#512b30;color:#fff}
    .noteEmpty{font-size:11px;color:#5e6063}
    .noteComposer{
      margin-top:13px;
      padding-top:13px;
      border-top:1px solid #242a33;
    }
    .noteComposerRow{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:8px;
    }
    .noteComposer input{min-width:0}
    .noteHint{margin-top:6px;font-size:10px;color:var(--muted2)}

    .heroBrowseBtn{width:100%;margin-top:10px}

    .heroBrowserOverlay{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px;
      background:rgba(2,4,7,.90);
      backdrop-filter:blur(4px);
    }
    .heroBrowserOverlay.hidden{display:none!important}
    .heroBrowserPanel{
      width:min(1060px,96vw);
      height:min(90vh,900px);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      border:1px solid #51442d;
      border-radius:7px;
      background:linear-gradient(180deg,#10151e,#080b10);
      box-shadow:var(--shadow),0 0 0 1px rgba(200,155,60,.06);
    }
    .heroBrowserHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:15px 16px 12px;
      border-bottom:1px solid #2b3038;
      background:linear-gradient(180deg,#141a24,#0f141c);
    }
    .heroBrowserTitle{
      color:var(--cream);
      font-family:var(--serif);
      font-size:20px;
      font-weight:700;
      letter-spacing:.06em;
    }
    .heroBrowserClose,.closeGame{
      width:40px;
      min-width:40px;
      height:40px;
      min-height:40px;
      padding:0;
      border:1px solid #4c4435;
      border-radius:50%;
      background:#11151c;
      color:#b9ac91;
      font-size:22px;
      line-height:1;
    }
    .heroBrowserClose:hover,.closeGame:hover{
      border-color:var(--gold);
      color:var(--cream);
      background:#18130c;
    }

    .heroBrowserTools{
      padding:12px 14px;
      border-bottom:1px solid #262d35;
      background:#0c1017;
    }
    .heroRoleTabs{
      display:flex;
      gap:6px;
      overflow-x:auto;
      padding-bottom:8px;
      scrollbar-width:thin;
    }
    .heroRoleTab{
      min-height:34px;
      padding:0 11px;
      white-space:nowrap;
      border:1px solid #3b4149;
      border-radius:3px;
      background:#111720;
      color:#aaa9a3;
      font-size:12px;
    }
    .heroRoleTab.active{
      border-color:#ad8536;
      color:#151009;
      background:linear-gradient(180deg,#d1ad57,#af7e29);
    }
    .heroSearch{margin-top:1px}
    .heroBrowserMeta{margin-top:7px;font-size:10px;color:var(--muted)}

    .heroBrowserBody{
      flex:1;
      overflow:auto;
      padding:12px 14px 18px;
      scrollbar-width:thin;
      scrollbar-color:#6e5525 transparent;
    }
    .heroCatalog{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
    }
    .heroCatalogCard{
      min-width:0;
      display:grid;
      grid-template-columns:64px minmax(0,1fr);
      gap:10px;
      align-items:center;
      padding:7px;
      border:1px solid #2d333b;
      border-radius:5px;
      background:linear-gradient(180deg,#111720,#0c1118);
      transition:border-color .14s ease,background-color .14s ease,transform .14s ease;
    }
    .heroCatalogCard:hover{
      border-color:#79622f;
      background:#15191d;
      transform:translateY(-1px);
    }
    .heroCatalogImg{
      width:64px;
      height:64px;
      object-fit:cover;
      border:1px solid #4f4633;
      border-radius:2px;
      background:#07090d;
    }
    .heroCatalogInfo{min-width:0}
    .heroCatalogName{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:var(--cream);
      font-family:var(--serif);
      font-size:15px;
      font-weight:700;
    }
    .heroCatalogTitle{
      margin-top:3px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:#94918a;
      font-size:11px;
    }
    .heroCatalogTags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
    .heroCatalogTag{
      padding:2px 5px;
      border:1px solid #403a2c;
      border-radius:2px;
      background:#15130e;
      color:#a99876;
      font-size:9px;
    }
    .heroCatalogEmpty{padding:30px 10px;text-align:center;color:var(--muted)}

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-top:14px;
    }

    .scoreRow{
      display:grid;
      grid-template-columns:42px 1fr 70px 70px;
      gap:8px;
      align-items:center;
      padding:11px 0;
      border-bottom:1px solid #242a31;
    }
    .scoreRow:last-child{border-bottom:0}
    .roundScoreRow{grid-template-columns:36px 44px minmax(0,1fr) 58px 58px}
    .roundHero{
      display:block;
      width:42px;
      height:42px;
      object-fit:cover;
      border:1px solid #544933;
      border-radius:2px;
      background:#07090d;
    }
    .roundHeroUnknown{
      display:grid;
      place-items:center;
      width:42px;
      height:42px;
      border:1px solid #48402f;
      border-radius:2px;
      background:#12151a;
      color:#9d8350;
      font-family:var(--serif);
      font-weight:900;
    }
    .roundNotes{margin-top:6px}
    .right{text-align:right}
    .topscore{font-weight:800;color:#d8b461}

    .mvp{text-align:center;padding:24px 10px}
    .crown{font-size:48px;filter:saturate(.8)}
    .mvpName{
      color:var(--cream);
      font-family:var(--serif);
      font-size:28px;
      font-weight:700;
      letter-spacing:.04em;
    }

    .notice{
      padding:10px 12px;
      border:1px solid #3a414b;
      border-radius:4px;
      background:#111720;
      color:#c9ced8;
      font-size:12px;
    }
    .err{
      border-color:#6d3439;
      background:#251417;
      color:#e4b6b9;
    }
    .small{font-size:11px;color:var(--muted)}

    .removeBtn{
      min-height:32px;
      padding:0 8px;
      border:1px solid #57383a;
      border-radius:3px;
      background:transparent;
      color:#b48386;
      font-size:11px;
      font-weight:700;
    }
    .removeBtn.confirming{
      border-color:#95505a;
      background:#5c2930;
      color:#fff;
    }

    .playerHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .playerHead .name{min-width:0;flex:1}

    .gameTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:8px 2px 10px;
      padding:0 2px 8px;
      border-bottom:1px solid rgba(200,155,60,.18);
    }
    .gameTop>b{
      color:var(--cream);
      font-family:var(--serif);
      letter-spacing:.05em;
    }
    .gameTopRight{display:flex;align-items:center;gap:8px}

    .exitBox{text-align:center;padding:30px 16px}
    .exitMark{
      margin-bottom:8px;
      color:#a75c61;
      font-family:var(--serif);
      font-size:42px;
    }

    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#5f4b24;border-radius:6px}
    ::selection{background:rgba(200,155,60,.28);color:var(--cream)}

    @media(min-width:620px){
      .players{grid-template-columns:repeat(3,minmax(0,1fr))}
      .heroGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .heroCatalog{grid-template-columns:repeat(3,minmax(0,1fr))}
      .wrap{padding-left:20px;padding-right:20px}
    }
    @media(min-width:920px){
      .heroGrid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .heroCatalog{grid-template-columns:repeat(4,minmax(0,1fr))}
    }
    @media(max-width:480px){
      .wrap{padding:18px 10px 38px}
      .card{padding:13px}
      .heroGrid{gap:8px}
      .heroFoot{padding:9px}
      .noteChip{font-size:10px}
      .heroBrowserPanel{width:100%;height:94vh}
      .heroBrowserOverlay{padding:7px}
      .heroCatalog{gap:7px}
      .heroCatalogCard{grid-template-columns:56px minmax(0,1fr);gap:8px;padding:6px}
      .heroCatalogImg{width:56px;height:56px}
      .roundScoreRow{grid-template-columns:28px 40px minmax(0,1fr) 48px 48px}
      .roundHero,.roundHeroUnknown{width:38px;height:38px}
    }
  </style>
</head>
<body>
<main class="wrap">
  <div class="brandKicker">LOL · GUESSING GAME</div>
  <h1>LOL 猜英雄</h1>

  <div id="setupWarning" class="notice err hidden"></div>

  <section id="joinView" class="card">
    <h2 style="margin-top:0;font-size:18px">加入游戏</h2>
    <form id="joinForm">
      <input id="nameInput" maxlength="16" placeholder="输入昵称" autocomplete="nickname" />
      <button class="primary" style="width:100%;margin-top:10px" type="submit">加入</button>
    </form>
  </section>

  <section id="lobbyView" class="hidden">
    <div class="card">
      <div class="row between">
        <div><b>等待玩家</b><div class="small"><span id="onlineCount">0</span> 人在线</div></div>
        <button id="leaveBtn" class="ghost" type="button">退出</button>
      </div>
      <div id="lobbyPlayers" class="players" style="margin-top:14px"></div>
      <button id="startBtn" class="primary" style="width:100%;margin-top:14px" type="button">开始比赛</button>
      <div class="small" style="margin-top:8px">至少 2 人。任何玩家都可开始。</div>
    </div>
  </section>

  <section id="gameView" class="hidden">
    <div class="gameTop">
      <b>第 <span id="roundNo">1</span> 轮</b>
      <div class="gameTopRight">
        <span class="tag">总分 <span id="myScore">0</span></span>
        <button id="forceExitBtn" class="closeGame" type="button" aria-label="退出本场比赛" title="退出本场比赛">×</button>
      </div>
    </div>
    <div id="heroGrid" class="heroGrid"></div>
    <div id="myControls" class="card">
      <div id="myStateText" style="text-align:center;font-weight:800">你的英雄：？？？</div>
      <div class="actions">
        <button id="guessedBtn" class="primary" type="button">我猜到了</button>
        <button id="giveUpBtn" class="danger" type="button">弃权</button>
      </div>

const VALID_STATUSES=new Set(["lobby","guessing","guessed","gaveup","left"]);
function safeStatus(value,fallback="guessing"){
  return VALID_STATUSES.has(value) ? value : fallback;
}
function safeInt(value,fallback=0,min=0,max=1_000_000_000){
  const n=Number(value);
  if(!Number.isFinite(n)) return fallback;
  return Math.min(max,Math.max(min,Math.trunc(n)));
}
function safeTimestamp(value){
  const n=Number(value);
  return Number.isFinite(n) && n>0 ? n : 0;
}

async function fetchJsonChecked(url,label){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  try{
    const res=await fetch(url,{signal:controller.signal,cache:"no-store"});
    if(!res.ok) throw new Error(`${label} HTTP ${res.status}`);
    return await res.json();
  }catch(e){
    if(e?.name==="AbortError") throw new Error(`${label}请求超时`);
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

async function loadChampions(){
  if(champions.length && championMeta.length) return;
  if(championLoadPromise) return championLoadPromise;

  championLoadPromise=(async()=>{
    const versions=await fetchJsonChecked(
      "https://ddragon.leagueoflegends.com/api/versions.json",
      "Data Dragon版本"
    );
    if(!Array.isArray(versions) || !versions.length || typeof versions[0]!=="string"){
      throw new Error("Data Dragon版本数据无效");
    }

    const version=versions[0];
    const data=await fetchJsonChecked(
      `https://ddragon.leagueoflegends.com/cdn/${encodeURIComponent(version)}/data/zh_CN/champion.json`,
      "英雄数据"
    );
    const raw=data?.data;
    if(!raw || typeof raw!=="object"){
      throw new Error("英雄数据格式无效");
    }

    const meta=Object.values(raw)
      .filter(c=>c && typeof c==="object" && /^[A-Za-z0-9_-]{1,64}$/.test(String(c.id||"")))
      .map(c=>({
        id:String(c.id),
        key:String(c.key ?? ""),
        name:String(c.name ?? "").trim(),
        title:String(c.title ?? "").trim(),
        tags:Array.isArray(c.tags) ? c.tags.filter(t=>typeof t==="string") : [],
        partype:String(c.partype ?? ""),
        blurb:String(c.blurb ?? "")
      }))
      .filter(c=>c.id && c.name)
      .sort((a,b)=>a.name.localeCompare(b.name,"zh-CN"));

    if(meta.length<100){
      throw new Error(`英雄数据数量异常（${meta.length}）`);
    }

    ddragonVersion=version;
    championMeta=meta;
    champions=meta.map(c=>c.id);
  })();

  try{
    await championLoadPromise;
  }finally{
    championLoadPromise=null;
  }
}

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

}

async function removePlayer(targetId){
  if(!backendAvailable || !gameRef || !targetId || targetId===meId) return;

  await runTransaction(gameRef,game=>{
    if(!game?.players?.[targetId]) return game;

    const phase=game.state?.phase||"lobby";
    if(phase!=="lobby") game.state.lastActivity=Date.now();
    delete game.players[targetId];

    if(phase==="playing"){
      const remaining=Object.values(game.players||{}).filter(p=>p.inMatch);

      if(remaining.length===0){
        resetToLobby(game);
      }else if(remaining.every(p=>safeStatus(p.status,"guessing")!=="guessing")){
        for(const p of remaining){
          if(!p.roundChampionId && p.championId) p.roundChampionId=p.championId;
        }
        game.state.phase="roundEnd";
      }

      // participantCount 保留开局人数，避免有人被移除后改变已经确定的计分基准。
    }

    if(phase==="roundEnd" || phase==="gameEnd"){
      const remainingPlayers=Object.values(game.players||{});
      if(remainingPlayers.length===0){
        resetToLobby(game);
      }
    }

    return game;
  });
}

async function touchActivity(force=false){
  if(!backendAvailable || !gameRef || !currentGame || !meId) return;

  const phase=currentGame.state?.phase||"lobby";
  const me=currentGame.players?.[meId];

  // Only a real participant in the current match can keep the match alive.
  if(phase==="lobby" || !me || me.online!==true || me.inMatch!==true) return;

  const now=Date.now();

  // Real throttle before any Firebase read/transaction.
  if(!force && now-lastActivityWrite<ACTIVITY_WRITE_THROTTLE_MS) return;
  lastActivityWrite=now;

  try{
    await runTransaction(gameRef,game=>{
      if(!game) return game;

      const livePhase=game.state?.phase||"lobby";
      const liveMe=game.players?.[meId];
      if(livePhase==="lobby" || !liveMe || liveMe.online!==true || liveMe.inMatch!==true){
        return game;
      }

      const last=safeTimestamp(game.state?.lastActivity);

      // Do not resurrect an already expired match.
      if(last && now-last>=INACTIVITY_LIMIT_MS){
        resetToLobby(game);
        return game;
      }

      game.state.lastActivity=now;
      return game;
    });
  }catch(e){
    if(lastActivityWrite===now) lastActivityWrite=0;
    console.warn("活动时间更新失败",e);
  }
}

async function checkInactivityTimeout(){
  if(!gameRef) return false;

  const now=Date.now();
  const localPhase=currentGame?.state?.phase||"lobby";
  const localLast=safeTimestamp(currentGame?.state?.lastActivity);
  const locallyExpired=localPhase!=="lobby" && !!localLast && now-localLast>=INACTIVITY_LIMIT_MS;

  const result=await runTransaction(gameRef,game=>{
    if(!game) return game;

    const phase=game.state?.phase||"lobby";
    if(phase==="lobby") return game;

    const last=safeTimestamp(game.state?.lastActivity);

    // Old versions may not have lastActivity. Start timing from now.
    if(!last){
      game.state.lastActivity=now;
      return game;
    }

    if(now-last>=INACTIVITY_LIMIT_MS){
      resetToLobby(game);
    }
    return game;
  });

  // No mutable flag is written from inside a transaction callback.
  const finalGame=result?.snapshot?.val?.() || null;
  return Boolean(locallyExpired && finalGame?.state?.phase==="lobby");
}

function startInactivityWatcher(){
  if(inactivityTimer) clearInterval(inactivityTimer);
  inactivityTimer=setInterval(()=>{
    checkInactivityTimeout().catch(e=>console.warn("超时检查失败",e));
  },30000);
}

function resetToLobby(game){
  game.state={phase:"lobby",round:0,finishCounter:0,participantCount:0,lastActivity:Date.now()};
  for(const p of Object.values(game.players||{})){
    p.status="lobby";
    p.inMatch=false;
    p.roundScore=0;
    p.championId=null;
    p.roundChampionId=null;
    p.notes=null;
    p.finishOrder=null;
  }
  return game;
}

async function recoverAbandonedGame(){
  await runTransaction(gameRef,game=>{
    if(!game) return game;
    const phase=game.state?.phase||"lobby";
    if(phase==="lobby") return game;

    const anyoneOnline=Object.values(game.players||{}).some(p=>p?.online===true);
    if(!anyoneOnline) resetToLobby(game);
    return game;
  });
}

async function configureDisconnectGuard(g=currentGame){
  const seq=++disconnectGuardSeq;
  if(!db || !meId) return;

  const me=g?.players?.[meId];

  // If this player was removed from Firebase, cancel the old onDisconnect hook.
  // Otherwise closing the removed client's tab could recreate a partial "ghost" player.
  if(!me){
    const oldHandle=disconnectHandle;
    disconnectHandle=null;
    disconnectMode="";
    if(oldHandle){
      try{ await oldHandle.cancel(); }catch(e){ console.warn("取消旧 onDisconnect 失败",e); }
    }
    return;
  }

  const status=safeStatus(me.status,me.inMatch===true?"guessing":"lobby");
  const shouldExitMatch=
    g?.state?.phase==="playing" &&
    me.inMatch===true &&
    status==="guessing";
  const mode=shouldExitMatch ? "exitMatch" : "offlineOnly";

  if(disconnectMode===mode && disconnectHandle) return;

  const oldHandle=disconnectHandle;
  disconnectHandle=null;
  disconnectMode="";

  try{
    if(oldHandle) await oldHandle.cancel();
    if(seq!==disconnectGuardSeq) return;

    const handle=onDisconnect(ref(db,`${ROOT}/players/${meId}`));

    if(shouldExitMatch){
      await handle.update({
        online:false,
        inMatch:false,
        status:"left",
        roundScore:0,
        finishOrder:null
      });
    }else{
      await handle.update({online:false});
    }

    // A newer snapshot may have requested another disconnect mode while awaiting Firebase.
    if(seq!==disconnectGuardSeq){
      try{ await handle.cancel(); }catch(e){}
      return;
    }

    disconnectHandle=handle;
    disconnectMode=mode;
  }catch(e){
    console.warn("onDisconnect 配置失败",e);
  }
}

async function maybeCloseRound(g=currentGame){
  if(closingRound || !gameRef || g?.state?.phase!=="playing") return;
  const participants=Object.values(g.players||{}).filter(p=>p.inMatch);

  if(participants.length===0){
    closingRound=true;
    try{
      await runTransaction(gameRef,game=>{
        if(!game || game.state?.phase!=="playing") return game;
        const live=Object.values(game.players||{}).filter(p=>p.inMatch);
        if(live.length!==0) return game;
        resetToLobby(game);
        return game;
      });
    }finally{ closingRound=false; }
    return;
  }

  if(participants.every(p=>safeStatus(p.status,"guessing")!=="guessing")){
    closingRound=true;
    try{
      await runTransaction(gameRef,game=>{
        if(!game || game.state?.phase!=="playing") return game;
        const live=Object.values(game.players||{}).filter(p=>p.inMatch);
        if(live.length && live.every(p=>safeStatus(p.status,"guessing")!=="guessing")){
          for(const p of live){
            if(!p.roundChampionId && p.championId) p.roundChampionId=p.championId;
          }
          game.state.phase="roundEnd";
          game.state.lastActivity=Date.now();
        }
        return game;
      });
    }finally{ closingRound=false; }
  }
}

function render(){
  const g=currentGame;
  if(!g){ showView("joinView"); return; }
  const me=g.players?.[meId];

  if(!me){
    explicitExitLocal=false;
    showView("joinView");
    return;
  }
  const phase=g.state?.phase||"lobby";

  if(explicitExitLocal || (phase!=="lobby" && safeStatus(me.status,"guessing")==="left")){
    showView("exitView");
    return;
  }

  if(phase==="lobby"){
    showView("lobbyView");
    const ps=allOnlinePlayers(g);
    $("onlineCount").textContent=ps.length;
    $("lobbyPlayers").innerHTML=ps.map(([id,p])=>`
      <div class="p ${id===meId?"you":""}">
        <div class="playerHead">
          <div class="name"><span class="dot"></span>${esc(safePlayerName(p))}${id===meId?"（你）":""}</div>
          ${removeButtonHtml(id)}
        </div>
        <div class="meta">已加入</div>
      </div>`).join("");
    bindRemoveButtons();
    $("startBtn").disabled=ps.length<2 || roundStartBusy || !backendAvailable;
    return;
  }

  if(phase==="playing"){
    showView("gameView");
    $("roundNo").textContent=safeInt(g.state?.round,1,1,9999);
    $("myScore").textContent=safeInt(me.score);
    const participants=activePlayers(g);
    $("heroGrid").innerHTML=participants.map(([id,p])=>{
      const isMe=id===meId;
      const pStatus=safeStatus(p.status,"guessing");
      const canSee = !isMe || pStatus!=="guessing";
      let media;
      const visibleChampionId=safeChampionId(p.championId);
      if(canSee && visibleChampionId){
        media=`<img class="heroPic" src="${heroUrl(visibleChampionId)}" alt="英雄头像">`;
      } else {
        media=`<div class="unknown" aria-label="未知英雄">?</div>`;
      }
      const renderStatus=pStatus;
      let stat = renderStatus==="guessed" ? `<span class="tag oktag">已猜到 +${safeInt(p.roundScore)}</span>`
               : renderStatus==="gaveup" ? `<span class="tag outtag">已弃权 +0</span>`
               : `<span class="tag">猜测中</span>`;
      return `<div class="heroCard ${isMe?"you":""}">
        ${media}
        <div class="heroFoot">
          <div class="playerHead">
            <div class="name">${esc(safePlayerName(p))}${isMe?"（你）":""}</div>
            ${removeButtonHtml(id)}
          </div>
          <div class="status">${stat}</div>
          ${notesHtml(p,id,{editable:isMe && pStatus==="guessing"})}
        </div>
      </div>`;
    }).join("");
    bindRemoveButtons();
    bindNoteDeleteButtons();

    const done=safeStatus(me.status,"guessing")!=="guessing";
    $("guessedBtn").disabled=done;
    $("giveUpBtn").disabled=done;
    $("noteInput").disabled=done;
    $("addNoteBtn").disabled=done;
    $("noteComposer").classList.toggle("hidden",false);
    $("myStateText").textContent =
      safeStatus(me.status,"guessing")==="guessed" ? `已猜到，本轮 +${safeInt(me.roundScore)}`
      : safeStatus(me.status,"guessing")==="gaveup" ? "已弃权，本轮 +0"
      : "你的英雄：？？？";
    const myChampionId=safeChampionId(me.championId);
    if(done && myChampionId){
      $("revealBox").classList.remove("hidden");
      $("revealImg").src=heroUrl(myChampionId);
    }else{
      $("revealBox").classList.add("hidden");
    }
    return;
  }

  if(phase==="roundEnd"){
    showView("roundEndView");
    const ps=rankPlayers(activePlayers(g));
    $("roundScores").innerHTML=ps.map(([id,p],i)=>{
      const resultChampionId = safeChampionId(p.roundChampionId) || safeChampionId(p.championId) || null;
      const hero = resultChampionId
        ? `<img class="roundHero" data-round-hero src="${heroUrl(resultChampionId)}" alt="${esc(safePlayerName(p))}本轮英雄头像">`
        : `<div class="roundHeroUnknown" aria-label="英雄未知">?</div>`;
      return `<div class="scoreRow roundScoreRow">
        <div>${i+1}</div>
        <div>${hero}</div>
        <div>
          <div class="playerHead">
            <div class="name">${esc(safePlayerName(p))}${id===meId?"（你）":""}</div>
            ${removeButtonHtml(id)}
          </div>
          <div class="small">${safeStatus(p.status,"guessed")==="gaveup"?"弃权":"完成"}</div>
          ${notesHtml(p,id,{editable:false,roundEnd:true})}
        </div>
        <div class="right">+${safeInt(p.roundScore)}</div>
        <div class="right topscore">${safeInt(p.score)}</div>
      </div>`;
    }).join("");
    bindRemoveButtons();
    document.querySelectorAll("[data-round-hero]").forEach(img=>{
      img.addEventListener("error",()=>{
        const fallback=document.createElement("div");
        fallback.className="roundHeroUnknown";
        fallback.textContent="?";
        fallback.setAttribute("aria-label","英雄头像加载失败");
        img.replaceWith(fallback);
      },{once:true});
    });
    return;
  }

  if(phase==="gameEnd"){
    showView("finalView");
    const ps=rankPlayers(activePlayers(g));
    const max=ps.length ? safeInt(ps[0][1].score) : 0;
    const mvps=ps.filter(([,p])=>safeInt(p.score)===max).map(([,p])=>safePlayerName(p));
    $("mvpBox").innerHTML=`<div class="crown">🏆</div><div class="small">MVP</div>
      <div class="mvpName">${esc(mvps.join(" & "))}</div><div class="topscore">${max} 分</div>`;
    $("finalScores").innerHTML=ps.map(([id,p],i)=>`
      <div class="scoreRow">
        <div>${i+1}</div>
        <div class="playerHead">
          <div class="name">${esc(safePlayerName(p))}${id===meId?"（你）":""}</div>
          ${removeButtonHtml(id)}
        </div>
        <div></div><div class="right topscore">${safeInt(p.score)}</div>
      </div>`).join("");
    bindRemoveButtons();
  }
}
function seedFromString(s){
  let h=2166136261>>>0;
  for(const ch of String(s)){
    h^=ch.codePointAt(0);
    h=Math.imul(h,16777619)>>>0;
  }
  return h||0x9e3779b9;
}
function seededShuffle(a,seedText){
  const out=[...a];
  let x=seedFromString(seedText);
  const rand=()=>{
    x^=x<<13; x>>>=0;
    x^=x>>>17; x>>>=0;
    x^=x<<5; x>>>=0;
    return (x>>>0)/4294967296;
  };
  for(let i=out.length-1;i>0;i--){
    const j=Math.floor(rand()*(i+1));
    [out[i],out[j]]=[out[j],out[i]];
  }
  return out;
}

async function assignAndStartRound(isFirst){
  if(roundStartBusy || !backendAvailable || !gameRef) return;
  roundStartBusy=true;

  const button=isFirst ? $("startBtn") : $("nextRoundBtn");
  const oldDisabled=button.disabled;
  button.disabled=true;

  try{
    if(champions.length===0){
      try{
        await loadChampions();
      }catch(e){
        console.warn("英雄数据加载失败",e);
        alert("英雄数据加载失败，暂时无法开始游戏。\n\n"+(e?.message||"请检查网络后重试。"));
        return;
      }
    }

    if(champions.length<2){
      alert("英雄数据不完整，暂时无法开始游戏。");
      return;
    }

    // The seed is captured once, so Firebase transaction retries keep the same shuffle.
    const seed=`${Date.now()}-${meId}-${uid()}`;
    const pool=seededShuffle(champions,seed);

    const result=await runTransaction(gameRef,game=>{
      if(!game) return game;

      const phase=game.state?.phase||"lobby";
      if(isFirst && phase!=="lobby") return game;
      if(!isFirst && phase!=="roundEnd") return game;

      const liveIds=Object.entries(game.players||{})
        .filter(([,p])=>
          p && typeof p==="object" &&
          (isFirst
            ? p.online===true
            : (p.inMatch===true && p.online===true && safeStatus(p.status,"left")!=="left"))
        )
        .map(([id])=>id)
        .sort();

      if(liveIds.length<2 || liveIds.length>pool.length) return game;

      const liveSet=new Set(liveIds);
      const assignmentIndex=new Map(liveIds.map((id,i)=>[id,i]));
      const nextRound=isFirst ? 1 : safeInt(game.state?.round,1,1,9998)+1;

      game.state={
        phase:"playing",
        round:nextRound,
        finishCounter:0,
        participantCount:liveIds.length,
        lastActivity:Date.now()
      };

      for(const [id,p] of Object.entries(game.players||{})){
        if(!p || typeof p!=="object") continue;

        const participates=liveSet.has(id);
        p.inMatch=participates;

        if(participates){
          if(isFirst) p.score=0;
          const assignedChampion=pool[assignmentIndex.get(id)];
          p.championId=assignedChampion;
          p.roundChampionId=assignedChampion;
          p.notes=null;
          p.status="guessing";
          p.roundScore=0;
          p.finishOrder=null;
        }
      }
      return game;
    });

    const finalGame=result?.snapshot?.val?.() || null;
    const finalPhase=finalGame?.state?.phase||"lobby";

    if(finalPhase!=="playing"){
      const eligibleNow=Object.values(finalGame?.players||{}).filter(p=>
        p && typeof p==="object" &&
        (isFirst
          ? p.online===true
          : (p.inMatch===true && p.online===true && safeStatus(p.status,"left")!=="left"))
      ).length;

      if(eligibleNow<2) alert("至少需要 2 名玩家。");
      else if(eligibleNow>champions.length) alert("在线玩家数量超过可用英雄数量，无法保证英雄唯一。");
      else alert("游戏状态已经变化，请稍后重试。");
    }
  }catch(e){
    console.error("开始回合失败",e);
    alert("开始游戏失败："+(e?.message||"未知错误"));
  }finally{
    roundStartBusy=false;
    // render() will normally restore the correct disabled state from Firebase.
    // If nothing changed, restore the pre-click state.
    if(button && document.body.contains(button)) button.disabled=oldDisabled;
  }
}
async function finishMe(kind){
  if(!backendAvailable || !gameRef || !meId) return;
  await runTransaction(gameRef, game=>{
    if(!game || game.state?.phase!=="playing") return game;
    const p=game.players?.[meId];
    if(!p || !p.inMatch || p.status!=="guessing") return game;

    game.state.lastActivity=Date.now();

    if(!p.roundChampionId && p.championId) p.roundChampionId=p.championId;

    if(kind==="guessed"){
      game.state.finishCounter=safeInt(game.state.finishCounter,0,0,100000)+1;
      const order=game.state.finishCounter;
      const n=safeInt(game.state.participantCount,1,1,100000);
      const points=Math.max(1,n-order+1);
      p.status="guessed";
      p.finishOrder=order;
      p.roundScore=points;
      p.score=safeInt(p.score)+points;
    }else{
      p.status="gaveup"; p.finishOrder=null; p.roundScore=0;
    }
    const participants=Object.values(game.players||{}).filter(x=>x.inMatch);
    if(participants.length && participants.every(x=>safeStatus(x.status,"guessing")!=="guessing")){
      for(const x of participants){
        if(!x.roundChampionId && x.championId) x.roundChampionId=x.championId;
      }
      game.state.phase="roundEnd";
    }
    return game;
  });
}

async function forceExitMatch(){
  if(!backendAvailable || !gameRef || !meId) return;
  explicitExitLocal=true;

  await runTransaction(gameRef,game=>{
    if(!game) return game;
    const p=game.players?.[meId];
    if(!p) return game;

    const phase=game.state?.phase||"lobby";
    if(phase!=="lobby") game.state.lastActivity=Date.now();
    p.online=false;
    p.status="left";

    // 游戏进行中：立即移出本轮，避免阻塞其他玩家。
    if(phase==="playing"){
      p.inMatch=false;
      p.roundScore=0;
      p.finishOrder=null;
      p.championId=null;

      const remaining=Object.values(game.players||{}).filter(x=>x.inMatch);
      if(remaining.length===0){
        resetToLobby(game);
      }else if(remaining.every(x=>safeStatus(x.status,"guessing")!=="guessing")){
        for(const x of remaining){
          if(!x.roundChampionId && x.championId) x.roundChampionId=x.championId;
        }
        game.state.phase="roundEnd";
      }
    }

    // 单轮结算 / 最终结算：保留其历史积分用于排行榜，
    // 但 offline + left 会让他无法被带入下一轮。
    if(phase==="roundEnd" || phase==="gameEnd"){
      const anyoneOnline=Object.values(game.players||{}).some(x=>x?.online===true);
      if(!anyoneOnline) resetToLobby(game);
    }

    return game;
  });

  try{
    if(disconnectHandle) await disconnectHandle.cancel();
  }catch(e){}
  disconnectHandle=null;
  disconnectMode="";
  render();
}

/* Firebase boot */
let initializeApp,getDatabase,ref,onValue,set,update,get,runTransaction,onDisconnect,remove;
async function boot(){
  if(setupMissing()){
    setBackendUnavailable("尚未配置 Firebase。请把 Firebase Web 配置粘贴到 index.html 顶部的 firebaseConfig。");
    return;
  }

  try{
    ({initializeApp}=await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js"));
    ({getDatabase,ref,onValue,set,update,get,runTransaction,onDisconnect,remove}=await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js"));

    const app=initializeApp(firebaseConfig);
    db=getDatabase(app);
    gameRef=ref(db,ROOT);
    meId=localStorage.getItem("lolGuessPlayerId")||uid();
    localStorage.setItem("lolGuessPlayerId",meId);

    backendAvailable=true;

    // Check global inactivity before recovering stale sessions.
    await checkInactivityTimeout();
    await recoverAbandonedGame();

    startInactivityWatcher();
    clearBackendWarning();

    onValue(
      gameRef,
      s=>{
        currentGame=s.val()||{state:{phase:"lobby"},players:{}};
        render();
        configureDisconnectGuard(currentGame).catch(e=>console.warn("断线保护更新失败",e));
        maybeCloseRound(currentGame).catch(e=>console.warn("回合状态检查失败",e));
      },
      e=>{
        console.error("Firebase 实时监听失败",e);
        setBackendUnavailable("Firebase 实时同步失败："+(e?.message||"未知错误"));
      }
    );

    const existing=await get(ref(db,`${ROOT}/players/${meId}`));
    if(existing.exists()){
      const ep=existing.val()||{};
      const rootSnap=await get(gameRef);
      const phase=rootSnap.val()?.state?.phase||"lobby";
      if(phase==="lobby" || safeStatus(ep.status,"lobby")!=="left"){
        await update(ref(db,`${ROOT}/players/${meId}`),{online:true});
      }
      disconnectMode="";
      await configureDisconnectGuard(currentGame);
    }

    // Preload for a smoother first round, but failure here is non-fatal.
    loadChampions()
      .then(()=>{
        if(currentGame) render();
        if(!$("heroBrowserOverlay").classList.contains("hidden")) renderHeroBrowser();
      })
      .catch(e=>console.warn("英雄数据预加载失败",e));
  }catch(e){
    console.error("Firebase 初始化失败",e);
    setBackendUnavailable("连接 Firebase 失败："+(e?.message||"未知错误"));
  }
}
$("joinForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!backendAvailable || !db || !gameRef){
    alert("后端尚未连接，请刷新页面后重试。");
    return;
  }
  const name=$("nameInput").value.trim();
  if(!name) return;
  const phase=currentGame?.state?.phase||"lobby";
  if(phase!=="lobby"){ alert("比赛已经开始，请等下一场。"); return; }
  explicitExitLocal=false;
  await set(ref(db,`${ROOT}/players/${meId}`),{
    name:Array.from(name).slice(0,16).join(""),online:true,inMatch:false,score:0,status:"lobby",championId:null,roundChampionId:null,notes:null,joinedAt:Date.now()
  });
  disconnectMode="";
  await configureDisconnectGuard(currentGame);
});
$("leaveBtn").addEventListener("click",async()=>{
  if(!backendAvailable || !db || !gameRef) return;
  if(currentGame?.state?.phase!=="lobby") return;
  try{ if(disconnectHandle) await disconnectHandle.cancel(); }catch(e){}
  disconnectHandle=null; disconnectMode="";
  await remove(ref(db,`${ROOT}/players/${meId}`));
  localStorage.removeItem("lolGuessPlayerId");
  meId=uid(); localStorage.setItem("lolGuessPlayerId",meId);
  explicitExitLocal=false;
});

$("nextRoundBtn").addEventListener("click",()=>assignAndStartRound(false).catch(e=>console.error(e)));

$("heroBrowseBtn").addEventListener("click",()=>openHeroBrowser());
$("heroBrowserClose").addEventListener("click",closeHeroBrowser);
$("heroBrowserOverlay").addEventListener("click",e=>{
  if(e.target===$("heroBrowserOverlay")) closeHeroBrowser();
});
$("heroSearch").addEventListener("input",e=>{
  heroBrowserQuery=e.target.value || "";
  renderHeroBrowser();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && !$("heroBrowserOverlay").classList.contains("hidden")){
    closeHeroBrowser();
  }
});

$("noteForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const textValue=$("noteInput").value.trim().replace(/\s+/g," ");
  if(!textValue || !db || !meId) return;

  const me=currentGame?.players?.[meId];
  if(currentGame?.state?.phase!=="playing" || me?.inMatch!==true || safeStatus(me.status,"guessing")!=="guessing") return;

  // Keep notes lightweight and readable on mobile.
  const existing=sortedNotes(me);
  if(existing.length>=50){
    alert("本轮最多记录 50 条笔记。");
    return;
  }

  const noteId=uid();
  $("addNoteBtn").disabled=true;
  try{
    await set(ref(db,`${ROOT}/players/${meId}/notes/${noteId}`),{
      text:Array.from(textValue).slice(0,10).join(""),
      createdAt:Date.now()
    });
    $("noteInput").value="";
    touchActivity(false).catch(()=>{});
  }catch(err){
    console.warn("添加笔记失败",err);
    alert("添加笔记失败，请重试。");
  }finally{
    const stillGuessing=currentGame?.state?.phase==="playing" &&
      safeStatus(currentGame?.players?.[meId]?.status,"guessing")==="guessing";
    $("addNoteBtn").disabled=!stillGuessing;
    if(stillGuessing) $("noteInput").focus();
  }
});

$("guessedBtn").addEventListener("click",()=>finishMe("guessed").catch(e=>{console.error(e);alert("提交结果失败，请重试。");}));
$("giveUpBtn").addEventListener("click",()=>{
  if(confirm("确定弃权？弃权后本轮 0 分，并显示你的英雄。")) finishMe("gaveup").catch(e=>{console.error(e);alert("弃权提交失败，请重试。");});
});
function confirmExit(){
  const phase=currentGame?.state?.phase||"lobby";
  const msg = phase==="playing"
    ? "确定退出本场比赛？\n\n退出后你会立即离开本轮，其他玩家可以继续进行。"
    : "确定退出本场比赛？\n\n你的历史积分会保留在当前结算中，但你不会进入下一轮。";
  if(confirm(msg)) forceExitMatch();
}
$("forceExitBtn").addEventListener("click",confirmExit);
$("roundExitBtn").addEventListener("click",confirmExit);
$("finalExitBtn").addEventListener("click",confirmExit);
$("endGameBtn").addEventListener("click",()=>runTransaction(gameRef,g=>{
  if(g?.state?.phase==="roundEnd"){
    g.state.phase="gameEnd";
    g.state.lastActivity=Date.now();
  }
  return g;
}));
$("restartBtn").addEventListener("click",()=>runTransaction(gameRef,g=>{
  if(!g) return g;
  g.state={phase:"lobby",round:0,finishCounter:0,participantCount:0,lastActivity:Date.now()};
  for(const p of Object.values(g.players||{})){
    p.score=0;p.roundScore=0;p.status="lobby";p.inMatch=false;p.championId=null;p.roundChampionId=null;p.notes=null;p.finishOrder=null;
  }
  return g;
}));

// Only current match participants refresh global activity.
// pointerdown covers mouse / pen / touch on modern mobile browsers.
["pointerdown","keydown"].forEach(evt=>{
  document.addEventListener(evt,()=>{
    touchActivity(false).catch(e=>console.warn("活动更新失败",e));
  },{passive:true});
});

// Returning from the background performs one guarded transaction:
// expired matches reset instead of being resurrected.
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    touchActivity(true).catch(e=>console.warn("恢复活动检查失败",e));
  }
});

boot();
